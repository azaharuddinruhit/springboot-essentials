spring.application.name=springboot-essentials

############## Server Configuration ##############
server.port=20020
server.servlet.context-path=/se
management.server.port=20025
management.endpoints.web.exposure.include=health,info

############## Undertow Configuration ##############
server.undertow.threads.io=8
server.undertow.threads.worker=64

############## Redis Configuration ##############
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=123456
spring.data.redis.database=0

############## RabbitMQ Configuration ##############
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.queue.name=se.default.queue
rabbitmq.exchange.name=se.default.exchange
rabbitmq.routing.key=se.default.routing-key

############## SpringDoc Configuration ##############
springdoc.api-docs.enabled=true

############## Database Configuration ##############
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=se
spring.datasource.password=se123
spring.sql.init.mode=never
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=se
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

#spring.jpa.properties.hibernate.generate_statistics=true
#spring.jpa.properties.hibernate.jdbc.batch_size=50
#spring.jpa.properties.hibernate.order_inserts=true
#spring.jpa.properties.hibernate.order_updates=true

############## Hikari Configuration ##############
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=3

spring.graphql.schema.locations=classpath:graphql/
spring.graphql.graphiql.enabled=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.docker.compose.enabled=true
spring.docker.compose.file=docker-compose.yml
spring.docker.compose.lifecycle-management=start_only

#se.kafka.bootstrap.servers=10.15.20.71:9092,10.15.20.72:9092,10.15.20.73:9092
spring.kafka.bootstrap-servers=10.15.20.71:9092,10.15.20.72:9092,10.15.20.73:9092
se.kafka.order-topic=test-topic-order
se.kafka.order-group=CMS
se.kafka.consumer.backoff-interval=2000
se.kafka.consumer.backoff-max-retries=2
