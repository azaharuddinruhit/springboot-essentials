spring.application.name=token-management-service

############## Server Configuration ##############
server.port=20020
server.servlet.context-path=/token-management-service-1.0
management.server.port=20025
management.endpoints.web.exposure.include=health,info

############## Undertow Configuration ##############
server.undertow.threads.io=8
server.undertow.threads.worker=64

############## Redis Configuration ##############
spring.data.redis.host=localhost
spring.data.redis.port=6379

############## RabbitMQ Configuration ##############
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.queue.name=blockchain.default.queue
rabbitmq.exchange.name=blockchain.default.exchange
rabbitmq.routing.key=blockchain.default.routing-key

############## SpringDoc Configuration ##############
springdoc.api-docs.enabled=true

############## SocketIO Configuration ##############
socketio-server.host=localhost
socketio-server.port=10260

############## Database Configuration ##############
spring.datasource.url=jdbc:postgresql://localhost/postgres
spring.datasource.username=bgw
spring.datasource.password=bgw123
spring.sql.init.mode=never
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=postgres
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.hibernate.use-new-id-generator-mappings=false

spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

############## Hikari Configuration ##############
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=3
